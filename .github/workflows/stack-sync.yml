name: Stack Sync

on:
  push:
    branches:
      - chore/standardize-stack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stack-sync-medication
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/standardize-stack

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Migrate Tailwind 3 entrypoint to Tailwind 4
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('src/index.css')
          text = css.read_text()
          old = '@tailwind base;\n@tailwind components;\n@tailwind utilities;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy Tailwind directive block, found {text.count(old)}')
          css.write_text(text.replace(old, "@import 'tailwindcss';", 1))

          qa = Path('scripts/negative-storage-qa.mjs')
          qa_text = qa.read_text()
          old_signature = 'Storage.prototype.setItem = function (key, val) {'
          if qa_text.count(old_signature) != 1:
              raise SystemExit(f'Expected exactly one storage mock signature, found {qa_text.count(old_signature)}')
          qa.write_text(qa_text.replace(old_signature, 'Storage.prototype.setItem = function (key, _val) {', 1))
          PY
          rm -f tailwind.config.js postcss.config.js

      - name: Rebuild dependency lock from canonical manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --legacy-peer-deps

      - name: Install synchronized dependencies with strict peer resolution
        run: npm ci

      - name: Normalize canonical formatting
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Commit validated migration artifacts
        run: |
          if git diff --quiet; then
            echo "Migration artifacts already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- package-lock.json src scripts/negative-storage-qa.mjs tests vite.config.ts playwright.config.ts eslint.config.js package.json tailwind.config.js postcss.config.js
          git commit -m "chore(stack): apply validated canonical stack migration"
          git push origin HEAD:chore/standardize-stack
